<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Le Quoc Viet — Portfolio</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/desktop.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

<div id="desktop">

  <!-- Boot Screen -->
  <div id="boot-screen">
    <div class="boot-logo">LQV</div>
    <div class="boot-subtitle">Portfolio OS — Loading...</div>
    <div class="boot-bar-wrap">
      <div class="boot-bar"></div>
    </div>
  </div>

  <!-- Wallpaper -->
  <div id="wallpaper">
    <div class="particles" id="particles"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- Desktop Icons -->
  <div id="desktop-icons">
    <div class="desktop-icon" data-app="about" ondblclick="openApp('about')">
      <div class="icon-img"><i class="fas fa-user-circle" style="color:#6366f1"></i></div>
      <span>About_Me.txt</span>
    </div>
    <div class="desktop-icon" data-app="experience" ondblclick="openApp('experience')">
      <div class="icon-img"><i class="fas fa-folder" style="color:#f59e0b"></i></div>
      <span>Experience/</span>
    </div>
    <div class="desktop-icon" data-app="projects" ondblclick="openApp('projects')">
      <div class="icon-img"><i class="fas fa-folder-open" style="color:#f59e0b"></i></div>
      <span>Projects/</span>
    </div>
    <div class="desktop-icon" data-app="skills" ondblclick="openApp('skills')">
      <div class="icon-img"><i class="fas fa-code" style="color:#a855f7"></i></div>
      <span>skills.json</span>
    </div>
    <div class="desktop-icon" data-app="terminal" ondblclick="openApp('terminal')">
      <div class="icon-img"><i class="fas fa-terminal" style="color:#22c55e"></i></div>
      <span>Terminal</span>
    </div>
    <div class="desktop-icon" data-app="certificates" ondblclick="openApp('certificates')">
      <div class="icon-img"><i class="fas fa-certificate" style="color:#f59e0b"></i></div>
      <span>Certificates/</span>
    </div>
    <div class="desktop-icon" data-app="contact" ondblclick="openApp('contact')">
      <div class="icon-img"><i class="fas fa-address-card" style="color:#a855f7"></i></div>
      <span>Contact.lnk</span>
    </div>
    <div class="desktop-icon" data-app="recycle" ondblclick="openApp('recycle')">
      <div class="icon-img"><i class="fas fa-trash-alt" style="color:#6b7280"></i></div>
      <span>Recycle Bin</span>
    </div>
    <div class="desktop-icon" data-app="browser" ondblclick="openApp('browser')">
      <div class="icon-img"><i class="fas fa-globe" style="color:#3b82f6"></i></div>
      <span>Browser.app</span>
    </div>
  </div>

  <!-- Windows Container -->
  <div id="windows-container"></div>

  <!-- Start Menu -->
  <div id="start-menu" class="hidden">
    <div class="sm-profile">
      <img src="face-img.png" alt="Avatar" class="sm-avatar">
      <div class="sm-info">
        <div class="sm-name">Le Quoc Viet</div>
        <div class="sm-role">Backend Developer @ Sacombank</div>
      </div>
    </div>
    <div class="sm-grid">
      <button class="sm-app" onclick="openApp('about');closeStartMenu()">
        <i class="fas fa-user-circle"></i><span>About</span>
      </button>
      <button class="sm-app" onclick="openApp('experience');closeStartMenu()">
        <i class="fas fa-folder"></i><span>Experience</span>
      </button>
      <button class="sm-app" onclick="openApp('projects');closeStartMenu()">
        <i class="fas fa-folder-open"></i><span>Projects</span>
      </button>
      <button class="sm-app" onclick="openApp('skills');closeStartMenu()">
        <i class="fas fa-code"></i><span>Skills</span>
      </button>
      <button class="sm-app" onclick="openApp('terminal');closeStartMenu()">
        <i class="fas fa-terminal"></i><span>Terminal</span>
      </button>
      <button class="sm-app" onclick="openApp('certificates');closeStartMenu()">
        <i class="fas fa-certificate"></i><span>Certs</span>
      </button>
      <button class="sm-app" onclick="openApp('contact');closeStartMenu()">
        <i class="fas fa-address-card"></i><span>Contact</span>
      </button>
      <button class="sm-app" onclick="openApp('recycle');closeStartMenu()">
        <i class="fas fa-trash-alt"></i><span>Recycle</span>
      </button>
      <button class="sm-app" onclick="openApp('browser');closeStartMenu()">
        <i class="fas fa-globe"></i><span>Browser</span>
      </button>
    </div>
    <div class="sm-footer">
      <button class="sm-footer-btn" id="sm-theme-btn" onclick="toggleTheme()">
        <i class="fas fa-moon"></i> Theme
      </button>
      <button class="sm-footer-btn" id="sm-lang-btn" onclick="toggleLang()">
        <span>🇻🇳</span> Lang
      </button>
    </div>
  </div>

  <!-- Taskbar -->
  <div id="taskbar">
    <button id="start-btn" onclick="toggleStartMenu()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M3 3h8v8H3zm10 0h8v8h-8zM3 13h8v8H3zm10 0h8v8h-8z"/>
      </svg>
    </button>
    <div id="taskbar-items"></div>
    <div id="system-tray">
      <button class="tray-btn" id="tray-theme" title="Toggle theme" onclick="toggleTheme()">
        <i class="fas fa-moon"></i>
      </button>
      <button class="tray-btn" id="tray-lang" title="Toggle language" onclick="toggleLang()">
        <span id="tray-flag">🇻🇳</span>
      </button>
      <button class="tray-btn tray-music" id="tray-music" title="Music" onclick="toggleMusic()">
        <i class="fas fa-music"></i>
      </button>
      <div id="tray-clock">
        <span id="clock-time">00:00</span>
        <span id="clock-date">Mon 01</span>
      </div>
    </div>
  </div>

</div><!-- #desktop -->

<audio id="audioPlayer" loop></audio>
<script src="app.js"></script>
</body>
</html>
